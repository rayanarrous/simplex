<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solve Linear Equations using Simplex Method</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe6f0 0%, #ffd6e8 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }

        .header h1 {
            color: #ff4d94;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(255, 77, 148, 0.2);
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(255, 77, 148, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(255, 77, 148, 0.25);
        }

        .card h2 {
            color: #ff4d94;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #ffe6f0;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffe6f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff4d94;
        }

        .btn {
            background: #ff4d94;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(255, 77, 148, 0.3);
        }

        .btn:hover {
            background: #ff3380;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 77, 148, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .objective-function {
            margin-bottom: 25px;
        }

        .objective-function h3 {
            color: #ff4d94;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .coefficients-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .coefficient-input {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .coefficient-input input {
            width: 80px;
            padding: 10px;
            border: 2px solid #ffe6f0;
            border-radius: 8px;
            text-align: center;
        }

        .coefficient-input label {
            color: #ff4d94;
            font-weight: 600;
            min-width: 30px;
        }

        .constraint {
            background: #fff5f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid #ffe6f0;
        }

        .constraint h4 {
            color: #ff4d94;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .constraint-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .constraint-row select {
            padding: 10px;
            border: 2px solid #ffe6f0;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 1rem;
        }

        .constraint-row select:focus {
            outline: none;
            border-color: #ff4d94;
        }

        .rhs-input {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .rhs-input input {
            width: 100px;
            padding: 10px;
            border: 2px solid #ffe6f0;
            border-radius: 8px;
            text-align: center;
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .results.show {
            display: block;
        }

        .results-content {
            background: #fff5f9;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ffe6f0;
        }

        .results-content h3 {
            color: #ff4d94;
            margin-bottom: 15px;
        }

        .results-content pre {
            background: white;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #ffe6f0;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .card {
                padding: 20px;
            }

            .coefficients-grid {
                justify-content: center;
            }

            .constraint-row {
                flex-direction: column;
                align-items: stretch;
            }

            .constraint-row select,
            .constraint-row input {
                width: 100%;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .coefficient-input {
                flex-direction: column;
                width: 100%;
            }

            .coefficient-input input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Solve Linear Equations using Simplex Method</h1>
            <p>Enter your linear programming problem data to solve it</p>
        </div>

        <div class="main-content">
            <div class="card">
                <h2>Problem Settings</h2>
                <div class="form-group">
                    <label for="numVariables">Number of Variables:</label>
                    <input type="number" id="numVariables" min="2" max="10" value="2" placeholder="e.g., 2">
                </div>
                <div class="form-group">
                    <label for="numConstraints">Number of Constraints:</label>
                    <input type="number" id="numConstraints" min="1" max="20" value="2" placeholder="e.g., 2">
                </div>
                <div class="form-group">
                    <label for="problemType">Problem Type:</label>
                    <select id="problemType" style="width: 100%; padding: 12px; border: 2px solid #ffe6f0; border-radius: 8px; font-size: 1rem;">
                        <option value="max">Maximize</option>
                        <option value="min">Minimize</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn" onclick="generateModel()">Generate Model</button>
                </div>
            </div>

            <div class="card hidden" id="modelCard">
                <h2>Objective Function</h2>
                <div class="objective-function">
                    <h3>Z = <span id="objectiveFunction"></span></h3>
                    <div class="coefficients-grid" id="objectiveCoefficients"></div>
                </div>

                <h2 style="margin-top: 30px;">Constraints</h2>
                <div id="constraintsContainer"></div>

                <div class="btn-group">
                    <button class="btn" onclick="solveProblem()">Solve</button>
                    <button class="btn" onclick="resetForm()" style="background: #ff9999;">Reset</button>
                </div>
            </div>

            <div class="card results" id="resultsCard">
                <h2>Results</h2>
                <div class="results-content" id="resultsContent"></div>
            </div>
        </div>
    </div>

    <script>
        let numVariables = 2;
        let numConstraints = 2;
        let problemType = 'max';

        function generateModel() {
            numVariables = parseInt(document.getElementById('numVariables').value) || 2;
            numConstraints = parseInt(document.getElementById('numConstraints').value) || 2;
            problemType = document.getElementById('problemType').value;

            if (numVariables < 2 || numVariables > 10) {
                alert('Number of variables must be between 2 and 10');
                return;
            }

            if (numConstraints < 1 || numConstraints > 20) {
                alert('Number of constraints must be between 1 and 20');
                return;
            }

            // Generate objective function inputs
            generateObjectiveFunction();
            
            // Generate constraints inputs
            generateConstraints();

            // Show the model card
            document.getElementById('modelCard').classList.remove('hidden');
            document.getElementById('resultsCard').classList.remove('show');
        }

        function generateObjectiveFunction() {
            const container = document.getElementById('objectiveCoefficients');
            const functionDisplay = document.getElementById('objectiveFunction');
            container.innerHTML = '';

            let functionText = '';
            const variables = ['x', 'y', 'z', 'w', 'v', 'u', 't', 's', 'r', 'q'];

            for (let i = 0; i < numVariables; i++) {
                const varName = variables[i] || `x${i + 1}`;
                
                const inputGroup = document.createElement('div');
                inputGroup.className = 'coefficient-input';
                
                const input = document.createElement('input');
                input.type = 'number';
                input.step = 'any';
                input.id = `obj_${i}`;
                input.placeholder = '0';
                input.value = i === 0 ? '1' : '0';
                
                const label = document.createElement('label');
                label.textContent = varName;
                
                inputGroup.appendChild(input);
                inputGroup.appendChild(label);
                container.appendChild(inputGroup);

                if (i > 0) functionText += ' + ';
                functionText += `[${varName}] ${varName}`;
            }

            functionDisplay.textContent = functionText;
        }

        function generateConstraints() {
            const container = document.getElementById('constraintsContainer');
            container.innerHTML = '';

            const variables = ['x', 'y', 'z', 'w', 'v', 'u', 't', 's', 'r', 'q'];

            for (let i = 0; i < numConstraints; i++) {
                const constraintDiv = document.createElement('div');
                constraintDiv.className = 'constraint';
                constraintDiv.id = `constraint_${i}`;

                const title = document.createElement('h4');
                title.textContent = `Constraint ${i + 1}:`;
                constraintDiv.appendChild(title);

                const row = document.createElement('div');
                row.className = 'constraint-row';

                for (let j = 0; j < numVariables; j++) {
                    const varName = variables[j] || `x${j + 1}`;
                    
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.step = 'any';
                    input.id = `const_${i}_${j}`;
                    input.placeholder = '0';
                    input.className = 'coefficient-input';
                    input.style.width = '80px';
                    
                    const label = document.createElement('label');
                    label.textContent = varName;
                    label.style.marginLeft = '5px';
                    label.style.marginRight = '5px';
                    
                    const wrapper = document.createElement('div');
                    wrapper.style.display = 'flex';
                    wrapper.style.alignItems = 'center';
                    wrapper.style.gap = '5px';
                    wrapper.appendChild(input);
                    wrapper.appendChild(label);
                    
                    if (j < numVariables - 1) {
                        const plus = document.createElement('span');
                        plus.textContent = '+';
                        plus.style.margin = '0 5px';
                        plus.style.color = '#ff4d94';
                        wrapper.appendChild(plus);
                    }
                    
                    row.appendChild(wrapper);
                }

                const operator = document.createElement('select');
                operator.id = `operator_${i}`;
                operator.innerHTML = `
                    <option value="<=">≤</option>
                    <option value=">=">≥</option>
                    <option value="=">=</option>
                `;
                row.appendChild(operator);

                const rhsInput = document.createElement('input');
                rhsInput.type = 'number';
                rhsInput.step = 'any';
                rhsInput.id = `rhs_${i}`;
                rhsInput.placeholder = '0';
                rhsInput.style.width = '100px';
                row.appendChild(rhsInput);

                constraintDiv.appendChild(row);
                container.appendChild(constraintDiv);
            }
        }

        function solveProblem() {
            // Collect objective function coefficients
            const objectiveCoeffs = [];
            for (let i = 0; i < numVariables; i++) {
                const value = parseFloat(document.getElementById(`obj_${i}`).value) || 0;
                objectiveCoeffs.push(value);
            }

            // Collect constraints
            const constraints = [];
            const variables = ['x', 'y', 'z', 'w', 'v', 'u', 't', 's', 'r', 'q'];

            for (let i = 0; i < numConstraints; i++) {
                const coeffs = [];
                for (let j = 0; j < numVariables; j++) {
                    const value = parseFloat(document.getElementById(`const_${i}_${j}`).value) || 0;
                    coeffs.push(value);
                }
                const operator = document.getElementById(`operator_${i}`).value;
                const rhs = parseFloat(document.getElementById(`rhs_${i}`).value) || 0;

                constraints.push({
                    coefficients: coeffs,
                    operator: operator,
                    rhs: rhs
                });
            }

            // Solve using Simplex method
            const solution = simplexSolve(objectiveCoeffs, constraints);

            // Display results
            displayResults(objectiveCoeffs, constraints, solution);
        }

        function displayResults(objectiveCoeffs, constraints, solution) {
            const resultsContent = document.getElementById('resultsContent');
            const variables = ['x', 'y', 'z', 'w', 'v', 'u', 't', 's', 'r', 'q'];
            
            let resultHTML = '<h3>Entered Problem Data:</h3>';
            
            // Display objective function
            resultHTML += '<p><strong>Objective Function:</strong></p>';
            let objText = problemType === 'max' ? 'Maximize Z = ' : 'Minimize Z = ';
            for (let i = 0; i < objectiveCoeffs.length; i++) {
                if (objectiveCoeffs[i] !== 0 || i === 0) {
                    if (i > 0 && objectiveCoeffs[i] > 0) objText += ' + ';
                    if (objectiveCoeffs[i] < 0) objText += ' - ';
                    if (Math.abs(objectiveCoeffs[i]) !== 1) {
                        objText += Math.abs(objectiveCoeffs[i]);
                    }
                    objText += variables[i] || `x${i + 1}`;
                }
            }
            resultHTML += `<pre>${objText}</pre>`;

            // Display constraints
            resultHTML += '<p style="margin-top: 20px;"><strong>Constraints:</strong></p><pre>';
            for (let i = 0; i < constraints.length; i++) {
                let constraintText = '';
                let hasNonZero = false;
                for (let j = 0; j < constraints[i].coefficients.length; j++) {
                    const coeff = constraints[i].coefficients[j];
                    if (coeff !== 0) {
                        hasNonZero = true;
                        if (constraintText && coeff > 0) constraintText += ' + ';
                        if (coeff < 0) constraintText += ' - ';
                        if (Math.abs(coeff) !== 1) {
                            constraintText += Math.abs(coeff);
                        }
                        constraintText += variables[j] || `x${j + 1}`;
                    }
                }
                if (!hasNonZero) constraintText = '0';
                
                let opSymbol = '';
                if (constraints[i].operator === '<=') opSymbol = ' ≤ ';
                else if (constraints[i].operator === '>=') opSymbol = ' ≥ ';
                else opSymbol = ' = ';
                
                constraintText += opSymbol + constraints[i].rhs;
                resultHTML += constraintText + '\n';
            }
            resultHTML += '</pre>';

            // Display solution
            resultHTML += '<div style="margin-top: 30px; padding: 20px; background: #fff5f9; border-radius: 10px; border: 2px solid #ff4d94;">';
            resultHTML += '<h3 style="color: #ff4d94; margin-bottom: 15px;">Optimal Solution:</h3>';
            
            if (solution.status === 'optimal') {
                resultHTML += '<p style="color: #28a745; font-weight: 600; margin-bottom: 15px;">✓ Solution Found!</p>';
                
                // Display variable values
                resultHTML += '<p><strong>Variable Values:</strong></p><pre style="background: white; padding: 15px; border-radius: 8px;">';
                for (let i = 0; i < numVariables; i++) {
                    const varName = variables[i] || `x${i + 1}`;
                    const value = solution.variables[i] !== undefined ? solution.variables[i] : 0;
                    resultHTML += `${varName} = ${value.toFixed(4)}\n`;
                }
                resultHTML += '</pre>';
                
                // Display optimal value
                resultHTML += `<p style="margin-top: 15px;"><strong>Optimal Value:</strong></p>`;
                resultHTML += `<p style="font-size: 1.2rem; color: #ff4d94; font-weight: 600;">Z = ${solution.value.toFixed(4)}</p>`;
            } else if (solution.status === 'unbounded') {
                resultHTML += '<p style="color: #dc3545; font-weight: 600;">⚠ The problem is unbounded (no optimal solution exists).</p>';
            } else if (solution.status === 'infeasible') {
                resultHTML += '<p style="color: #dc3545; font-weight: 600;">⚠ The problem is infeasible (no solution exists).</p>';
            } else {
                resultHTML += '<p style="color: #ffc107; font-weight: 600;">⚠ Could not solve the problem. Please check your inputs.</p>';
            }
            
            resultHTML += '</div>';

            resultsContent.innerHTML = resultHTML;
            document.getElementById('resultsCard').classList.add('show');
            
            // Scroll to results
            document.getElementById('resultsCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Simplex Algorithm Implementation
        function simplexSolve(objectiveCoeffs, constraints) {
            const numVars = objectiveCoeffs.length;
            const numConstraints = constraints.length;
            
            // Convert to standard form for maximization
            // Simplex algorithm maximizes, so for minimization we maximize -Z
            const isMaximize = problemType === 'max';
            const objCoeffs = objectiveCoeffs.map(c => -c); // Negate because simplex maximizes
            
            // Count slack/surplus/artificial variables needed
            let slackCount = 0;
            let surplusCount = 0;
            let artificialCount = 0;
            const constraintTypes = [];
            
            for (let i = 0; i < numConstraints; i++) {
                if (constraints[i].operator === '<=') {
                    constraintTypes.push('slack');
                    slackCount++;
                } else if (constraints[i].operator === '>=') {
                    constraintTypes.push('surplus');
                    surplusCount++;
                    artificialCount++;
                } else { // '='
                    constraintTypes.push('equality');
                    artificialCount++;
                }
            }
            
            // Build the tableau
            const totalVars = numVars + slackCount + surplusCount + artificialCount;
            const tableau = [];
            
            // Initialize tableau with zeros
            for (let i = 0; i <= numConstraints; i++) {
                tableau.push(new Array(totalVars + 1).fill(0));
            }
            
            // Set objective row (last row)
            for (let i = 0; i < numVars; i++) {
                tableau[numConstraints][i] = objCoeffs[i];
            }
            
            // Fill constraints
            let slackIdx = numVars;
            let surplusIdx = numVars + slackCount;
            let artificialIdx = numVars + slackCount + surplusCount;
            
            for (let i = 0; i < numConstraints; i++) {
                // Copy constraint coefficients
                for (let j = 0; j < numVars; j++) {
                    tableau[i][j] = constraints[i].coefficients[j];
                }
                
                // Add slack/surplus/artificial variables
                if (constraintTypes[i] === 'slack') {
                    tableau[i][slackIdx] = 1;
                    slackIdx++;
                } else if (constraintTypes[i] === 'surplus') {
                    tableau[i][surplusIdx] = -1;
                    tableau[i][artificialIdx] = 1;
                    surplusIdx++;
                    artificialIdx++;
                } else { // equality
                    tableau[i][artificialIdx] = 1;
                    artificialIdx++;
                }
                
                // Set RHS
                tableau[i][totalVars] = constraints[i].rhs;
            }
            
            // If we have artificial variables, use two-phase method
            if (artificialCount > 0) {
                return twoPhaseSimplex(tableau, numVars, numConstraints, totalVars, artificialIdx, isMaximize);
            } else {
                return standardSimplex(tableau, numVars, numConstraints, totalVars, isMaximize);
            }
        }
        
        function standardSimplex(tableau, numVars, numConstraints, totalVars, isMaximize) {
            const maxIterations = 100;
            let iteration = 0;
            
            while (iteration < maxIterations) {
                // Check if optimal (all coefficients in objective row >= 0)
                let isOptimal = true;
                let pivotCol = -1;
                
                for (let j = 0; j < totalVars; j++) {
                    if (tableau[numConstraints][j] < -1e-10) {
                        isOptimal = false;
                        if (pivotCol === -1 || tableau[numConstraints][j] < tableau[numConstraints][pivotCol]) {
                            pivotCol = j;
                        }
                    }
                }
                
                if (isOptimal) break;
                
                // Find pivot row
                let pivotRow = -1;
                let minRatio = Infinity;
                
                for (let i = 0; i < numConstraints; i++) {
                    if (tableau[i][pivotCol] > 1e-10) {
                        const ratio = tableau[i][totalVars] / tableau[i][pivotCol];
                        if (ratio >= 0 && ratio < minRatio) {
                            minRatio = ratio;
                            pivotRow = i;
                        }
                    }
                }
                
                if (pivotRow === -1) {
                    return { status: 'unbounded', value: 0, variables: [] };
                }
                
                // Perform pivot
                pivot(tableau, pivotRow, pivotCol, numConstraints + 1, totalVars + 1);
                iteration++;
            }
            
            // Extract solution
            const solution = extractSolution(tableau, numVars, numConstraints, totalVars);
            // Since we negated coefficients, the value in tableau is -Z, so we negate it back
            const optimalValue = -tableau[numConstraints][totalVars];
            
            return {
                status: 'optimal',
                value: optimalValue,
                variables: solution
            };
        }
        
        function twoPhaseSimplex(tableau, numVars, numConstraints, totalVars, artificialStart, isMaximize) {
            // Phase 1: Minimize sum of artificial variables
            const phase1Tableau = tableau.map(row => [...row]);
            
            // Create phase 1 objective (minimize artificial variables)
            const phase1Obj = new Array(totalVars + 1).fill(0);
            for (let j = artificialStart - (totalVars - artificialStart); j < artificialStart; j++) {
                if (j >= 0) {
                    for (let i = 0; i < numConstraints; i++) {
                        phase1Obj[j] -= phase1Tableau[i][j];
                    }
                }
            }
            
            // Find artificial variables and set up phase 1 objective
            for (let j = numVars; j < totalVars; j++) {
                let isArtificial = false;
                for (let i = 0; i < numConstraints; i++) {
                    if (Math.abs(phase1Tableau[i][j] - 1) < 1e-10 && phase1Tableau[i][totalVars] !== 0) {
                        isArtificial = true;
                        break;
                    }
                }
                if (isArtificial) {
                    for (let i = 0; i < numConstraints; i++) {
                        phase1Obj[j] -= phase1Tableau[i][j];
                    }
                }
            }
            
            phase1Tableau[numConstraints] = phase1Obj;
            
            // Solve phase 1
            const maxIterations = 100;
            let iteration = 0;
            
            while (iteration < maxIterations) {
                let isOptimal = true;
                let pivotCol = -1;
                
                for (let j = 0; j < totalVars; j++) {
                    if (phase1Tableau[numConstraints][j] < -1e-10) {
                        isOptimal = false;
                        if (pivotCol === -1 || phase1Tableau[numConstraints][j] < phase1Tableau[numConstraints][pivotCol]) {
                            pivotCol = j;
                        }
                    }
                }
                
                if (isOptimal) break;
                
                let pivotRow = -1;
                let minRatio = Infinity;
                
                for (let i = 0; i < numConstraints; i++) {
                    if (phase1Tableau[i][pivotCol] > 1e-10) {
                        const ratio = phase1Tableau[i][totalVars] / phase1Tableau[i][pivotCol];
                        if (ratio >= 0 && ratio < minRatio) {
                            minRatio = ratio;
                            pivotRow = i;
                        }
                    }
                }
                
                if (pivotRow === -1) {
                    return { status: 'unbounded', value: 0, variables: [] };
                }
                
                pivot(phase1Tableau, pivotRow, pivotCol, numConstraints + 1, totalVars + 1);
                iteration++;
            }
            
            // Check if phase 1 optimal value is 0 (feasible)
            if (Math.abs(phase1Tableau[numConstraints][totalVars]) > 1e-10) {
                return { status: 'infeasible', value: 0, variables: [] };
            }
            
            // Phase 2: Use original objective
            const phase2Tableau = phase1Tableau.map(row => [...row]);
            
            // Restore original objective
            for (let j = 0; j < numVars; j++) {
                phase2Tableau[numConstraints][j] = tableau[numConstraints][j];
            }
            phase2Tableau[numConstraints][totalVars] = tableau[numConstraints][totalVars];
            
            // Zero out artificial variables in objective
            for (let j = numVars; j < totalVars; j++) {
                phase2Tableau[numConstraints][j] = 0;
            }
            
            // Make basic variables have zero coefficients in objective
            for (let i = 0; i < numConstraints; i++) {
                let basicCol = -1;
                for (let j = 0; j < totalVars; j++) {
                    if (Math.abs(phase2Tableau[i][j] - 1) < 1e-10) {
                        let isBasic = true;
                        for (let k = 0; k < numConstraints; k++) {
                            if (k !== i && Math.abs(phase2Tableau[k][j]) > 1e-10) {
                                isBasic = false;
                                break;
                            }
                        }
                        if (isBasic) {
                            basicCol = j;
                            break;
                        }
                    }
                }
                
                if (basicCol >= 0 && basicCol < numVars) {
                    const coeff = phase2Tableau[numConstraints][basicCol];
                    if (Math.abs(coeff) > 1e-10) {
                        for (let j = 0; j <= totalVars; j++) {
                            phase2Tableau[numConstraints][j] -= coeff * phase2Tableau[i][j];
                        }
                    }
                }
            }
            
            // Solve phase 2
            return standardSimplex(phase2Tableau, numVars, numConstraints, totalVars, isMaximize);
        }
        
        function pivot(tableau, pivotRow, pivotCol, numRows, numCols) {
            const pivotElement = tableau[pivotRow][pivotCol];
            
            // Normalize pivot row
            for (let j = 0; j < numCols; j++) {
                tableau[pivotRow][j] /= pivotElement;
            }
            
            // Eliminate pivot column
            for (let i = 0; i < numRows; i++) {
                if (i !== pivotRow) {
                    const factor = tableau[i][pivotCol];
                    for (let j = 0; j < numCols; j++) {
                        tableau[i][j] -= factor * tableau[pivotRow][j];
                    }
                }
            }
        }
        
        function extractSolution(tableau, numVars, numConstraints, totalVars) {
            const solution = new Array(numVars).fill(0);
            
            for (let j = 0; j < numVars; j++) {
                let basicRow = -1;
                let isBasic = false;
                
                for (let i = 0; i < numConstraints; i++) {
                    if (Math.abs(tableau[i][j] - 1) < 1e-10) {
                        let isOnlyOne = true;
                        for (let k = 0; k < numConstraints; k++) {
                            if (k !== i && Math.abs(tableau[k][j]) > 1e-10) {
                                isOnlyOne = false;
                                break;
                            }
                        }
                        if (isOnlyOne) {
                            basicRow = i;
                            isBasic = true;
                            break;
                        }
                    }
                }
                
                if (isBasic && basicRow >= 0) {
                    solution[j] = tableau[basicRow][totalVars];
                }
            }
            
            return solution;
        }

        function resetForm() {
            document.getElementById('modelCard').classList.add('hidden');
            document.getElementById('resultsCard').classList.remove('show');
            document.getElementById('numVariables').value = 2;
            document.getElementById('numConstraints').value = 2;
            document.getElementById('problemType').value = 'max';
        }
    </script>
